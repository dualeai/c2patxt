[project]
name = "c2patxt"
version = "0.1.0" # Overwritten by CI from the git tag; see cicd/version.sh and .github/workflows/release.yml
description = "Duale AI's implementation of C2PA text marking (C2PA 2.4 Annex A.8)"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10" # Matches sdk/python and hpke-http. Raise on 3.10 EOL (~Oct 2026).
authors = [{ name = "Duale AI" }]
keywords = [
    "c2pa",
    "content-credentials",
    "provenance",
    "ai-act",
    "synthetic-content",
    "text",
    "unicode",
    "variation-selectors",
    "jumbf",
    "cose",
    "ed25519",
    "watermark",
    "c2pa-2.4",
    "annex-a8",
    "ai-transparency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Security :: Cryptography",
    "Topic :: Text Processing",
    "Typing :: Typed",
]
# Exactly one runtime dependency, matching hpke-http. CBOR is implemented in-house
# (see src/c2patxt/_cbor.py) rather than taking cbor2, because C2PA 10.1 mandates
# RFC 8949 4.2.1 bytewise map ordering while cbor2's canonical=True implements
# 4.2.3 length-first ordering, and because a decoder that REJECTS non-deterministic
# input is a security property a general-purpose library cannot provide.
dependencies = ["cryptography~=48.0"]

[project.optional-dependencies]
# RFC 5280 6 certificate path validation. Kept optional because pyca/cryptography's
# x509.verification hardcodes an SPKI allowlist that excludes Ed25519 entirely
# (pyca/cryptography#13391), so the default install can reach C2PA state "Valid" but
# never "Trusted". This extra installs a validator a caller can BUILD a TrustEvaluator
# with -- it does not itself make anything Trusted. Nothing in this package imports it;
# TrustEvaluator is a Protocol the caller implements, and the shipped default trusts
# nothing. See src/c2patxt/trust.py.
trust = ["pyhanko-certvalidator~=0.31"]
dev = [
    "cbor2~=6.1",       # Differential-testing oracle for our own CBOR codec. NEVER a runtime dep.
    "hypothesis~=6.165",
    "pyright~=1.1",
    "pytest-codspeed~=5.0",     # Benchmarks only. Deselects every non-benchmark test, so it runs in its own target.
    "pytest-cov~=7.1",
    "pytest-socket~=0.7",       # Enforces the offline claim: no test may reach the network.
    "pytest-timeout~=2.4",      # A parser suite must never hang; see the XLBox=0 regression.
    "pytest-xdist[psutil]~=3.8",
    "pytest~=9.0",
    "ruff~=0.16",
    "twine~=6.0",
    # This package never imports it -- grep src/ is clean. It is here for type-checking
    # and is present at runtime anyway on Python < 3.14, as a transitive of cryptography.
    "typing_extensions~=4.12",
    "vulture~=2.14",
]

[project.urls]
Homepage = "https://duale.ai"
Documentation = "https://github.com/dualeai/c2patxt#readme"
Repository = "https://github.com/dualeai/c2patxt.git"
Changelog = "https://github.com/dualeai/c2patxt/releases"
Issues = "https://github.com/dualeai/c2patxt/issues"

[build-system]
requires = ["setuptools>=83.0.0"] # Pinned for CVE-2025-47273
build-backend = "setuptools.build_meta"

[tool.uv]
# Only resolve packages published at least this long ago. Mitigates typosquatting and
# malicious-release attacks (see the March 2026 litellm/TeamPCP campaign). A FIXED
# timestamp rather than a rolling window, so resolution is reproducible across days.
exclude-newer = "2026-08-05T00:00:00Z"

[tool.setuptools.packages.find]
where = ["src"]
include = ["c2patxt*"]

[tool.setuptools.package-data]
c2patxt = ["py.typed"]

[tool.pyright]
typeCheckingMode = "strict"
venv = ".venv"
venvPath = "."
exclude = [".venv", "build", "dist", "vulture_whitelist.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
    "--cov=c2patxt",             # Package name
    "--cov-report=term-missing", # Show missing lines in terminal
    "--cov-report=html",         # Generate HTML report
    "--cov-fail-under=90",       # Raised from hpke-http's 80: this is a small pure codec, not a large async surface
    "--tb=short",                # Short traceback format
    "-v",                        # Verbose output, easier LLM debugging
    # With no markers registered HERE, this makes an UNREGISTERED marker a hard
    # collection error rather than a warning. It is not a guarantee that no marker
    # appears: a marker a PLUGIN registers passes this check, and one did --
    # `pytestmark = pytest.mark.benchmark` sat in tests/benchmarks/ against
    # CONTRIBUTING.md's no-markers rule, accepted because pytest-codspeed registers
    # `benchmark` itself. It was inert, since selection is by directory and the plugin
    # gives the fixture precedence over the marker, and it has been removed. The rule
    # is enforced by review; this flag only catches the unregistered case.
    "--strict-markers",
    "-n",                        # Run tests in parallel
    "auto",                      # Use all available CPUs
    "--disable-socket",          # Self-contained: verification is offline, so tests must prove it
    # This package parses adversarial input. A malformed box once made the JUMBF
    # content loop spin forever; without a timeout that burns CI's 6-hour default
    # instead of failing. The whole suite runs in well under a minute, so 30s per
    # test is generous and still catches a hang immediately.
    "--timeout=30",
    # Benchmarks are NOT tests: they assert nothing about cost, and under this config
    # they would run with coverage and --timeout=30 and fold into --cov-fail-under=90.
    # Here rather than only in the Makefile so a bare `uv run pytest` excludes them too.
    # `make test-bench` blanks addopts entirely, which is how it still reaches them.
    #
    # NOT norecursedirs: that REPLACES pytest's defaults rather than extending them, so
    # it silently stopped ignoring .hypothesis, .git, build and dist.
    "--ignore=tests/benchmarks",
]
# NOTE: Rules for static testing are standard across all the monorepo, those rules are strict and
# must be followed, in any exception case please discuss with the team, in the meantime, if it
# fails, fix the issue, NEVER turn off the linter.

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "A",      # flake8-builtins
    "ANN401", # Disallow Any in function arguments
    "ARG",    # flake8-unused-arguments
    "ASYNC",  # flake8-async
    "B",      # flake8-bugbear
    "BLE",    # flake8-blind-except
    "DTZ",    # flake8-datetimez
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "FBT",    # flake8-boolean-trap
    "I",      # isort
    "N",      # pep8-naming
    "PERF",   # Perflint
    "PIE",    # flake8-pie
    "PL",     # Pylint
    "PYI",    # flake8-pyi
    "Q",      # flake8-quotes
    "RET",    # flake8-return
    "RUF",    # Ruff-specific
    "S",      # flake8-bandit
    "SIM",    # flake8-simplify
    "SLF",    # flake8-self
    "T20",    # flake8-print
    "TID",    # flake8-tidy-imports
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = ["PLR0913", "RUF012"]

[tool.ruff.lint.per-file-ignores]
# tools/ holds developer scripts run by hand, never imported by the package. Printing
# IS their output, and an attack that produces malformed text is a result to record
# rather than an exception to log.
"tools/*.py" = ["T201", "S112", "PLR2004"]
# Verdict._add is the verdict BUILDER, kept private so the public result type has no
# mutator a caller could use to assemble a verdict verification never produced.
# _verify is the one module that legitimately builds one.
"src/c2patxt/_verify.py" = ["SLF001"]
"tests/**/*.py" = [
    "PLR2004", # Allow magic values in tests
    "PLR0915", # Allow long test functions
    "S101",    # Allow assert
    "SLF001",  # Allow private member access for testing internals
    "ARG001",  # Allow unused function args (pytest fixtures)
    "ARG002",  # Allow unused method args (pytest fixtures)
    "F841",    # Allow unused variables (intermediate test results)
    "FBT001",  # Allow bool-typed parametrize args (the expected value IS a bool)
    "FBT003",  # Allow bool literals as positional args (dumps(True) is the point of the test)
    "PLC0415", # Allow imports inside functions (test isolation)
    "RUF059",  # Allow unused unpacked variables
]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.Any".msg = "Do not use Any. Define the typed boundary."
"typing_extensions.Any".msg = "Do not use Any. Define the typed boundary."
"typing.cast".msg = "Do not bypass type checking with cast. Narrow or parse into a typed model."
"typing_extensions.cast".msg = "Do not bypass type checking with cast. Narrow or parse into a typed model."

[tool.ruff.lint.isort]
known-first-party = ["c2patxt"]

[tool.vulture]
exclude = [".venv/"]              # Exclude dependencies
paths = ["src", "tests", "vulture_whitelist.py"]
min_confidence = 80               # Ignore crap detections
sort_by_size = true               # Most impactful issues first
