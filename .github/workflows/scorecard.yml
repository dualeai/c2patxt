name: Scorecard

on:
  branch_protection_rule:
  schedule:
    - cron: "0 4 * * 1" # Weekly, Monday 04:00 UTC
  push:
    branches: [main]

permissions: {}

jobs:
  analysis:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04 # x64: scorecard-action is amd64 only
    timeout-minutes: 15
    permissions:
      security-events: write # Upload SARIF to the code-scanning dashboard
      id-token: write # Publish results so the badge and API resolve
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishes the score so third parties can read it without a GitHub account.
          # For a compliance artefact the score is part of the product, not internal telemetry.
          publish_results: true

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
