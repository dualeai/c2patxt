name: Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

# Deny by default. A compromised third-party action cannot scrape a broad GITHUB_TOKEN
# out of runner memory if the token has no scopes to begin with. This is the exact
# class exploited in the March 2026 TeamPCP campaign, where a mutable action reference
# on Trivy was used to dump Runner.Worker memory and pivot to PyPI.
permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read # The only scope a test job needs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04-arm, macos-15, macos-26]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    env:
      JUNIT_XML: junit-${{ matrix.os }}-py${{ matrix.python-version }}.xml
      # Abort a sync BEFORE any install-time code executes if a package is flagged.
      UV_MALWARE_CHECK: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: make install-deps

      - name: Run static checks
        run: make test-static

      - name: Run tests
        run: make test-func
        env:
          PYTEST_ADDOPTS: "--junit-xml=${{ env.JUNIT_XML }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.JUNIT_XML }}
          path: ${{ env.JUNIT_XML }}
          if-no-files-found: ignore
